NAME=cg-new
VERSION=1.0.0
ARCH=all
SECTION=devel
DEPENDS="bash"
DESCRIPTION="Start a new project from a template in one command"
LONG_DESCRIPTION="cg-new <template> <name>. Templates: html, python, flask, node,
express, c, cpp, go, rust, java, php, bash. Creates the folder, a
starter file, a .gitignore and a git repo when git is installed."
USAGE="cg-new python myapp
cg-new node myapi
cg-new c hello"
