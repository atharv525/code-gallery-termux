NAME=cg-devkit
VERSION=1.0.0
ARCH=all
SECTION=devel
DEPENDS="python, python-pip, nodejs, git, gh, git-lfs, clang, make, cmake, ninja, pkg-config, binutils, gdb, golang, rust, openjdk-17, kotlin, php, ruby, perl, lua54, vim, neovim, nano, micro, tmux, openssh, curl, wget, jq, sqlite, ripgrep, fd, fzf, htop, tree, zip, unzip, shellcheck, cg-run, cg-new"
DESCRIPTION="Full coding toolkit in one install (metapackage)"
LONG_DESCRIPTION="Pulls in the official Termux coding tools: Python, Node.js, Git/gh,
Clang/Make/CMake, Go, Rust, Java 17, Kotlin, PHP, Ruby, Perl, Lua,
Vim/Neovim/Nano/Micro, tmux, OpenSSH and everyday CLI tools.
Needs several GB of space. For a smaller set use cg-setup."
USAGE="pkg install cg-devkit   # pulls the whole toolkit"
