NAME=cg-push
VERSION=1.0.0
ARCH=all
SECTION=devel
DEPENDS="bash, git"
DESCRIPTION="Git add, commit and push in one command"
LONG_DESCRIPTION="cg-push [message]. Stages everything, commits with your message
(or a timestamp), pulls with rebase and pushes the current branch."
USAGE="cg-push
cg-push "commit message""
