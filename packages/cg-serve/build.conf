NAME=cg-serve
VERSION=1.0.0
ARCH=all
SECTION=net
DEPENDS="bash"
RECOMMENDS="python"
DESCRIPTION="Serve the current folder as a website and show its LAN address"
LONG_DESCRIPTION="cg-serve [folder] [port]. Uses PHP's server when the folder has
index.php, otherwise Python's http.server. Prints the localhost and
Wi-Fi addresses so other devices on the network can open it."
