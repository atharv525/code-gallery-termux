NAME=cg-run
VERSION=1.0.0
ARCH=all
SECTION=devel
DEPENDS="bash"
DESCRIPTION="Compile and run any source file with one command"
LONG_DESCRIPTION="cg-run file.ext [args] picks the right compiler or interpreter:
c, cpp, py, js, ts, go, rs, java, kt, php, rb, pl, lua, sh, dart."
USAGE="cg-run main.py
cg-run app.js
cg-run hello.c"
