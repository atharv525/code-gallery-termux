NAME=cg-bugbounty
VERSION=1.0.0
ARCH=all
SECTION=net
DEPENDS="bash, git, curl"
RECOMMENDS="golang, python, python-pip"
SUGGESTS="nmap, dirb, rustscan, feroxbuster, proxychains-ng"
DESCRIPTION="Install bug-bounty and recon tools by group (recon, scan, fuzz, dns, web...)"
LONG_DESCRIPTION="One command to set up a bug-bounty toolkit on Termux. Pulls official
Termux packages where they exist and builds the rest (ProjectDiscovery
suite, tomnomnom tools, sqlmap, etc.) with go/pip/git.
Run cg-bugbounty for a menu, cg-bugbounty all for everything, or a group:
recon scan fuzz dns web passwords utils wordlists."
USAGE="cg-bugbounty          # menu
cg-bugbounty all      # install everything
cg-bugbounty recon web   # only chosen groups"
TOOLS="recon: subfinder assetfinder amass theHarvester nmap
scan: naabu httpx nuclei rustscan
fuzz: ffuf gobuster dirb feroxbuster
dns: dnsx puredns dnsrecon dnsutils
web: katana dalfox gau waybackurls hakrawler sqlmap wafw00f arjun nikto whatweb
passwords: hydra john hashcat
utils: httprobe anew gf unfurl qsreplace notify interactsh netcat socat tcpdump proxychains
wordlists: SecLists common.txt"
