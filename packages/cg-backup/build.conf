NAME=cg-backup
VERSION=1.0.0
ARCH=all
SECTION=utils
DEPENDS="bash, tar"
DESCRIPTION="Back up a project folder to phone storage"
LONG_DESCRIPTION="cg-backup [folder]. Saves a dated .tar.gz in
~/storage/shared/CodeGallery/backups (run termux-setup-storage once),
skipping node_modules, .venv, target and build folders."
USAGE="cg-backup            # backup current folder
cg-backup myproject  # backup a named folder"
