NAME=cg-setup
VERSION=1.0.0
ARCH=all
SECTION=devel
DEPENDS="bash, apt"
DESCRIPTION="Install coding toolkits by group (python, web, c, java, go, rust...)"
LONG_DESCRIPTION="Menu-driven installer for official Termux packages.
Run cg-setup for a menu, cg-setup code for everything, or a group
name such as python, web, c, java, go, rust, editors, media, db."
USAGE="cg-setup          # menu
cg-setup code     # everything
cg-setup python"
